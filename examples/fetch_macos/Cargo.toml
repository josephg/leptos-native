[package]
name = "fetch_macos"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "fetch_macos"
path = "src/main.rs"

[dependencies]
leptos = { path = "../../leptos", features = ["native-ui"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
