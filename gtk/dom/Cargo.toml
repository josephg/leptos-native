[package]
name = "gtk_dom"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "DOM-shaped façade over GTK4, used by tachys/leptos to render native Linux UIs."
rust-version.workspace = true
edition.workspace = true

[features]
default = []
# Build the GTK backend. Auto-required by `leptos_gtk/gtk`. On Linux
# the system gtk4 is usually packaged (e.g. `libgtk-4-dev` on Debian);
# on macOS install via `brew install gtk4` to test cross-platform.
# Without this feature, the crate compiles to empty so its presence
# in the workspace doesn't force gtk4 onto every build.
gtk = ["dep:gtk4", "dep:glib", "dep:gio", "dep:any_spawner", "dep:taffy"]
# Strokes a 1px outline around every Taffy-tracked node, toggled with
# the `~` key. See `gtk_dom::debug_overlay`. Off by default — flip on
# per-binary in the example's Cargo.toml when debugging layout.
debug-overlay = ["gtk"]
# Chrome DevTools Protocol server: inspect & live-edit the layout tree
# from Chrome DevTools. Requires `gtk`. Started at runtime via the
# `LEPTOS_DEVTOOLS` env var. See `gtk_dom::devtools`.
devtools = ["gtk", "dep:leptos_devtools", "dep:futures"]

[dependencies]
renderer = { workspace = true }
send_wrapper = { workspace = true, default-features = true }
gtk4 = { workspace = true, default-features = true, optional = true }
glib = { workspace = true, default-features = true, optional = true }
gio = { workspace = true, default-features = true, optional = true }
any_spawner = { workspace = true, features = ["glib"], optional = true }
taffy = { workspace = true, optional = true }
leptos_devtools = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }

# GTK requires the main thread for almost every API. Cargo's default
# test harness spawns a worker thread per test; gtk::init then panics.
# Each integration test below uses `harness = false` and supplies its
# own main fn that runs the test bodies sequentially on the actual
# main thread (via the `run_tests` helper in `tests/common`).

[[test]]
name = "element_creation"
path = "tests/element_creation.rs"
harness = false

[[test]]
name = "events"
path = "tests/events.rs"
harness = false

[[test]]
name = "text_and_placeholder"
path = "tests/text_and_placeholder.rs"
harness = false

[[test]]
name = "tree_mutation"
path = "tests/tree_mutation.rs"
harness = false

[[test]]
name = "node_lifecycle"
path = "tests/node_lifecycle.rs"
harness = false

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[[test]]
name = "grid_layout"
path = "tests/grid_layout.rs"
harness = false

[[test]]
name = "apply_attrs"
path = "tests/apply_attrs.rs"
harness = false

[[test]]
name = "layout_dirtying"
path = "tests/layout_dirtying.rs"
harness = false

[[test]]
name = "focus"
path = "tests/focus.rs"
harness = false

[[test]]
name = "thread_safety"
path = "tests/thread_safety.rs"
harness = false

[[test]]
name = "async_bridge"
path = "tests/async_bridge.rs"
harness = false
