[package]
name = "leptos_gtk"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "GTK4 native UI port for the leptos-mac fork."
rust-version.workspace = true
edition.workspace = true

[lib]
name = "leptos_gtk"

[features]
default = ["gtk"]
# Build the GTK backend. Forwards to `gtk_dom/gtk` and pulls in the
# gtk4 / glib / gio system bindings. Enabled by default: a user
# adding `leptos = { package = "leptos_gtk" }` to their Cargo.toml
# gets a working build with no extra feature flag.
#
# Disable with `default-features = false` to typecheck the
# renderer-agnostic core on a machine without gtk4 headers — that
# mode is for contributors working on `common/renderer` from a
# non-Linux host, not for end users.
gtk = ["dep:gtk4", "dep:glib", "dep:gio", "dep:any_spawner"]
# Strokes a 1px outline around every Taffy-tracked node, toggled with
# the `~` key. Forwards to `gtk_dom/debug-overlay`.
debug-overlay = []
# Chrome DevTools Protocol server. Forwards to `gtk_dom/devtools`;
# started at runtime via the `LEPTOS_DEVTOOLS` env var.
devtools = ["dep:futures", "dep:leptos_devtools"]

[dependencies]
reactive_graph = { workspace = true, features = ["effects"] }
leptos_native = { workspace = true }
#leptos_macro = { workspace = true }
#either_of = { workspace = true }
#oco_ref = { workspace = true }
send_wrapper = { workspace = true, default-features = true }
gtk4 = { workspace = true, default-features = true, optional = true }
glib = { workspace = true, default-features = true, optional = true }
gio = { workspace = true, default-features = true, optional = true }
any_spawner = { workspace = true, features = ["glib"], optional = true }
#taffy = { workspace = true, optional = true }
leptos_devtools = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }

# GTK requires the main thread; see gtk_dom/Cargo.toml for the same
# pattern. Each integration test below uses `harness = false` and
# supplies its own main fn that runs the test bodies sequentially on
# the main thread (via `run_tests` in `tests/common`).

[[test]]
name = "add_any_attr"
path = "tests/add_any_attr.rs"
harness = false

[[test]]
name = "bind_cycle"
path = "tests/bind_cycle.rs"
harness = false

[[test]]
name = "components"
path = "tests/components.rs"
harness = false

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false


