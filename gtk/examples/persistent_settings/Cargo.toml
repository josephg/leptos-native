[package]
name = "persistent_settings_gtk"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
leptos_native = { package = "leptos_gtk", path = "../../leptos_gtk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }
