[package]
name = "async_patterns_cocoa"
version = "0.1.0"
edition = "2021"
publish = false

# Network-dependent demo. See workspace Cargo.toml — excluded from
# `default-members` so it's skipped by bare `cargo build`.

[dependencies]
leptos_native = { package = "leptos_cocoa", path = "../../leptos_cocoa" }
leptos_apple_shared = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
