[package]
name = "leptos_cocoa"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "Cocoa/AppKit native UI port for the leptos-mac fork."
rust-version.workspace = true
edition.workspace = true

[lib]
name = "leptos_cocoa"

[dependencies]
renderer = { workspace = true }
reactive_graph = { workspace = true, features = ["effects"] }
leptos_native = { workspace = true }
leptos_macro = { workspace = true }
leptos_apple_shared = { workspace = true }
either_of = { workspace = true }
oco_ref = { workspace = true }
send_wrapper = { workspace = true, default-features = true }
throw_error = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
any_spawner = { workspace = true }
block2 = { version = "0.6", optional = true } # Used by debug-overlay.
dispatch2 = "0.3"
futures = { workspace = true, default-features = true }
taffy = { workspace = true }
objc2-foundation = { version = "0.3", features = [
  "NSGeometry",
  "NSString",
  "NSObjCRuntime",
  "NSThread",
  "NSTimer",
  "NSDate",
  "NSUserDefaults",
  "NSCalendar",
  "NSLocale",
  "NSTimeZone",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-core-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
  "NSLayoutConstraint",
  "objc2-core-foundation",
  "NSApplication",
  "NSWindow",
  "NSView",
  "NSResponder",
  "NSButton",
  "NSControl",
  "NSFont",
  "NSText",
  "NSTextField",
  "NSTextView",
  "NSSecureTextField",
  "NSScrollView",
  "NSSlider",
  "NSPopUpButton",
  "NSCell",
  "NSParagraphStyle",
  "NSColor",
  "NSGraphics",
  "NSEvent",
  "NSRunningApplication",
  "NSStackView",
  "NSImage",
  "NSImageView",
  "NSSegmentedControl",
  "NSColorWell",
  "NSDatePicker",
  "NSDatePickerCell",
  "NSStepper",
  "NSStepperCell",
  "NSProgressIndicator",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSTrackingArea",
] }


[features]
default = []
# Strokes a 1px outline around every Taffy-tracked node, toggled with
# the `~` key.
debug-overlay = [
  "objc2-app-kit/NSBezierPath",
  "objc2-app-kit/block2",
  "dep:block2",
]
# CoreAnimation integration: enables `cocoa_dom::animation` plus
# implicit animation of layer-backed property changes
# (background_color, corner_radius, border, alpha) when invoked
# inside `with_animation(...)`. Pulls in the CAAnimation /
# CATransaction / CASpringAnimation / CAMediaTimingFunction
# subsystems of objc2-quartz-core. Off by default — opting in adds
# linkage to the full QuartzCore animation surface; without it the
# port behaves exactly as before (every property change snaps).
animation = [
  "objc2-quartz-core/CAAnimation",
  "objc2-quartz-core/CATransaction",
  "objc2-quartz-core/CAMediaTiming",
  "objc2-quartz-core/CAMediaTimingFunction",
  "objc2-quartz-core/CATransform3D",
  "objc2-foundation/NSValue",
  "dep:objc2-core-graphics",
]

[target.'cfg(target_os = "macos")'.dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
