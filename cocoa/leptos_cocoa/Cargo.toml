[package]
name = "leptos_cocoa"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "Cocoa/AppKit native UI port for the leptos-mac fork."
rust-version.workspace = true
edition.workspace = true

[lib]
name = "leptos_cocoa"

[dependencies]
renderer = { workspace = true }
reactive_graph = { workspace = true, features = ["effects"] }
leptos = { workspace = true }
leptos_macro = { workspace = true }
leptos_apple_shared = { workspace = true }
either_of = { workspace = true }
oco_ref = { workspace = true }
send_wrapper = { workspace = true, default-features = true }
throw_error = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa_dom = { path = "../dom", version = "0.1.0" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
any_spawner = { workspace = true }

[features]
default = []
# Strokes a 1px outline around every Taffy-tracked node, toggled with
# the `~` key. Forwards to `cocoa_dom`.
debug-overlay = ["cocoa_dom/debug-overlay"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }

[[test]]
name = "add_any_attr"
path = "tests/add_any_attr.rs"
harness = false

[[test]]
name = "components"
path = "tests/components.rs"
harness = false

[[test]]
name = "bind_cycle"
path = "tests/bind_cycle.rs"
harness = false

[[test]]
name = "two_handlers"
path = "tests/two_handlers.rs"
harness = false

[[test]]
name = "switch"
path = "tests/switch.rs"
harness = false

[[test]]
name = "split_view"
path = "tests/split_view.rs"
harness = false

[[test]]
name = "toolbar"
path = "tests/toolbar.rs"
harness = false
