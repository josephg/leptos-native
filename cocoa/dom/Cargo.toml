[package]
name = "cocoa_dom"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "DOM-shaped façade over Cocoa/AppKit, used by tachys/leptos to render native macOS UIs."
rust-version.workspace = true
edition.workspace = true

[features]
default = []
# Strokes a 1px outline around every Taffy-tracked node, toggled with
# the `~` key. See `cocoa_dom::debug_overlay`. Off by default — flip
# on per-binary in the example's Cargo.toml when debugging layout.
debug-overlay = [
  "objc2-app-kit/NSBezierPath",
  "objc2-app-kit/block2",
  "dep:block2",
]
# CoreAnimation integration: enables `cocoa_dom::animation` plus
# implicit animation of layer-backed property changes
# (background_color, corner_radius, border, alpha) when invoked
# inside `with_animation(...)`. Pulls in the CAAnimation /
# CATransaction / CASpringAnimation / CAMediaTimingFunction
# subsystems of objc2-quartz-core. Off by default — opting in adds
# linkage to the full QuartzCore animation surface; without it the
# port behaves exactly as before (every property change snaps).
animation = [
  "objc2-quartz-core/CAAnimation",
  "objc2-quartz-core/CATransaction",
  "objc2-quartz-core/CAMediaTiming",
  "objc2-quartz-core/CAMediaTimingFunction",
  "objc2-quartz-core/CATransform3D",
  "objc2-foundation/NSValue",
  "dep:objc2-core-graphics",
]

[dependencies]
renderer = { workspace = true }
send_wrapper = { workspace = true, default-features = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }
leptos_apple_shared = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = { version = "0.6", optional = true }
dispatch2 = "0.3"
any_spawner = { workspace = true }
futures = { workspace = true, default-features = true }
taffy = { workspace = true }
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSObjCRuntime",
    "NSThread",
    "NSTimer",
    "NSDate",
    "NSUserDefaults",
    "NSCalendar",
    "NSLocale",
    "NSTimeZone",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-core-graphics = { version = "0.3", optional = true }
objc2-core-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSLayoutConstraint",
    "objc2-core-foundation",
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSButton",
    "NSControl",
    "NSFont",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSSecureTextField",
    "NSScrollView",
    "NSSlider",
    "NSPopUpButton",
    "NSCell",
    "NSParagraphStyle",
    "NSColor",
    "NSGraphics",
    "NSEvent",
    "NSRunningApplication",
    "NSStackView",
    "NSImage",
    "NSImageView",
    "NSSegmentedControl",
    "NSColorWell",
    "NSDatePicker",
    "NSDatePickerCell",
    "NSStepper",
    "NSStepperCell",
    "NSProgressIndicator",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSTrackingArea",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }

# AppKit needs the main thread. Cargo's default test harness spawns a
# worker thread per test; AppKit calls then panic via
# `MainThreadMarker::new()` returning None. Each integration test
# below uses `harness = false` and supplies its own main fn that runs
# the test bodies sequentially on the actual main thread (via the
# `main_thread_test_main!` macro in `tests/common`).

[[test]]
name = "element_creation"
path = "tests/element_creation.rs"
harness = false

[[test]]
name = "attributes"
path = "tests/attributes.rs"
harness = false

[[test]]
name = "events"
path = "tests/events.rs"
harness = false

[[test]]
name = "text_and_placeholder"
path = "tests/text_and_placeholder.rs"
harness = false

[[test]]
name = "tree_mutation"
path = "tests/tree_mutation.rs"
harness = false

[[test]]
name = "node_lifecycle"
path = "tests/node_lifecycle.rs"
harness = false

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[[test]]
name = "grid_layout"
path = "tests/grid_layout.rs"
harness = false

[[test]]
name = "apply_attrs"
path = "tests/apply_attrs.rs"
harness = false

[[test]]
name = "app_menu"
path = "tests/app_menu.rs"
harness = false

[[test]]
name = "menu"
path = "tests/menu.rs"
harness = false

[[test]]
name = "icon"
path = "tests/icon.rs"
harness = false


[[test]]
name = "interval"
path = "tests/interval.rs"
harness = false

[[test]]
name = "storage"
path = "tests/storage.rs"
harness = false

[[test]]
name = "focus"
path = "tests/focus.rs"
harness = false

[[test]]
name = "thread_safety"
path = "tests/thread_safety.rs"
harness = false

[[test]]
name = "layout_dirtying"
path = "tests/layout_dirtying.rs"
harness = false

[[test]]
name = "debug_overlay"
path = "tests/debug_overlay.rs"
harness = false
required-features = ["debug-overlay"]

[[test]]
name = "async_bridge"
path = "tests/async_bridge.rs"
harness = false

[[test]]
name = "image_bytes"
path = "tests/image_bytes.rs"
harness = false

[[test]]
name = "signal_mt"
path = "tests/signal_mt.rs"
harness = false

[[test]]
name = "animation"
path = "tests/animation.rs"
harness = false
required-features = ["animation"]
