[package]
name = "leptos_integration_utils"
authors = ["Greg Johnston"]
license = "MIT"
repository = "https://github.com/leptos-rs/leptos"
description = "Utilities to help build server integrations for the Leptos web framework."
version = "0.8.8"
rust-version.workspace = true
edition.workspace = true

[dependencies]
futures = { workspace = true, default-features = true }
hydration_context = { workspace = true }
leptos = { workspace = true, features = ["nonce"] }
leptos_meta = { workspace = true, features = ["ssr"] }
leptos_router = { workspace = true, features = ["ssr"] }
leptos_config = { workspace = true }
reactive_graph = { workspace = true, features = ["sandboxed-arenas"] }

[features]
# Defensive: when native-ui is enabled in a build that happens to
# include this crate, lib.rs is gated to empty (it's web-only — an
# SSR integration helper).
native-ui = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
