[package]
name = "gtk_dom"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "DOM-shaped façade over GTK4, used by tachys/leptos to render native Linux UIs."
rust-version.workspace = true
edition.workspace = true

[dependencies]
send_wrapper = { workspace = true, default-features = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }
tachys = { workspace = true, features = ["reactive_graph"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { workspace = true, default-features = true }
glib = { workspace = true, default-features = true }
gio = { workspace = true, default-features = true }
any_spawner = { workspace = true }
futures = { workspace = true, default-features = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }
