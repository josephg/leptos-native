[package]
name = "cocoa_dom"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "DOM-shaped façade over Cocoa/AppKit, used by tachys/leptos to render native macOS UIs."
rust-version.workspace = true
edition.workspace = true

[features]
default = []
# Enables Taffy's `block_layout` algorithm and the `<block>` tag in
# `Element::create_with`. Off by default to keep binary size down
# for apps that only need flex.
block_layout = ["taffy/block_layout"]

[dependencies]
send_wrapper = { workspace = true, default-features = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }
tachys = { workspace = true, features = ["reactive_graph", "native-ui", "block_layout"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
any_spawner = { workspace = true }
futures = { workspace = true, default-features = true }
taffy = { version = "0.10", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSObjCRuntime",
    "NSThread",
    "NSTimer",
    "NSDate",
    "NSUserDefaults",
    "NSCalendar",
    "NSLocale",
    "NSTimeZone",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSView",
    "NSResponder",
    "NSButton",
    "NSControl",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSSecureTextField",
    "NSScrollView",
    "NSSlider",
    "NSPopUpButton",
    "NSCell",
    "NSColor",
    "NSGraphics",
    "NSEvent",
    "NSRunningApplication",
    "NSStackView",
    "NSImage",
    "NSImageView",
    "NSSegmentedControl",
    "NSColorWell",
    "NSDatePicker",
    "NSDatePickerCell",
    "NSStepper",
    "NSStepperCell",
    "NSProgressIndicator",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }

# AppKit needs the main thread. Cargo's default test harness spawns a
# worker thread per test; AppKit calls then panic via
# `MainThreadMarker::new()` returning None. Each integration test
# below uses `harness = false` and supplies its own main fn that runs
# the test bodies sequentially on the actual main thread (via the
# `main_thread_test_main!` macro in `tests/common`).

[[test]]
name = "element_creation"
path = "tests/element_creation.rs"
harness = false

[[test]]
name = "attributes"
path = "tests/attributes.rs"
harness = false

[[test]]
name = "events"
path = "tests/events.rs"
harness = false

[[test]]
name = "text_and_placeholder"
path = "tests/text_and_placeholder.rs"
harness = false

[[test]]
name = "tree_mutation"
path = "tests/tree_mutation.rs"
harness = false

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[[test]]
name = "app_menu"
path = "tests/app_menu.rs"
harness = false

[[test]]
name = "builders"
path = "tests/builders.rs"
harness = false

[[test]]
name = "interval"
path = "tests/interval.rs"
harness = false

[[test]]
name = "storage"
path = "tests/storage.rs"
harness = false

[[test]]
name = "focus"
path = "tests/focus.rs"
harness = false
