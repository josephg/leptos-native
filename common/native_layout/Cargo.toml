[package]
name = "native_layout"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "Renderer-agnostic layout engine: Taffy storage tree + LayoutBackend trait. Used by the cocoa, iOS, and GTK ports."
rust-version.workspace = true
edition.workspace = true

[dependencies]
taffy = { workspace = true }
slotmap = { workspace = true, default-features = true }

[features]
default = []
# Forwarded Taffy feature: enables the `<block>` display algorithm.
block_layout = ["taffy/block_layout"]
