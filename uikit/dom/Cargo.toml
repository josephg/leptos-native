[package]
name = "ios_dom"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "DOM-shaped façade over UIKit, used by tachys/leptos to render native iOS UIs."
rust-version.workspace = true
edition.workspace = true

[dependencies]
renderer = { workspace = true }
send_wrapper = { workspace = true, default-features = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }

[target.'cfg(target_os = "ios")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"

[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
any_spawner = { workspace = true }
futures = { workspace = true, default-features = true }
taffy = { workspace = true }
native_layout = { workspace = true }
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSTimer",
    "NSDate",
    "NSUserDefaults",
] }
objc2-quartz-core = { version = "0.3", features = [
    "CALayer",
    "objc2-core-foundation",
] }
objc2-ui-kit = { version = "0.3", features = [
    "alloc",
    "UIApplication",
    "UIWindow",
    "UIWindowScene",
    "UIScene",
    "UISceneSession",
    "UISceneConfiguration",
    "UISceneOptions",
    "UIView",
    "UIControl",
    "UIButton",
    "UILabel",
    "UITextField",
    "UISwitch",
    "UISlider",
    "UIScrollView",
    "UITextView",
    "UIStepper",
    "UIProgressView",
    "UIImageView",
    "UISegmentedControl",
    "UIDatePicker",
    "UIColor",
    "UIFont",
    "UIViewController",
    "UIEvent",
    "UIImage",
    "UILayoutGuide",
    "UIKeyboardLayoutGuide",
    "UIGeometry",
    "UIGestureRecognizer",
    "UITapGestureRecognizer",
    "UIScreen",
    "NSText",
    "UITextInputTraits",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }
