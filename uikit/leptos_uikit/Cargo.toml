[package]
name = "leptos_uikit"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "UIKit native UI port for the leptos-mac fork (iOS)."
rust-version.workspace = true
edition.workspace = true

[lib]
name = "leptos_uikit"

[features]
default = []
calendar = ["dep:objc2-event-kit"]

[dependencies]
reactive_graph = { workspace = true, features = ["effects", "serde"] }
leptos_native = { workspace = true }
leptos_macro = { workspace = true }
leptos_apple_shared = { workspace = true }
either_of = { workspace = true }
oco_ref = { workspace = true }
send_wrapper = { workspace = true, default-features = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSGeometry",
  "NSString",
  "NSTimer",
  "NSDate",
  "NSUserDefaults",
  "NSBundle",
  "NSURL",
  "NSDictionary",
  "NSEnumerator",
  "NSIndexPath",
] }
objc2-ui-kit = { version = "0.3", features = [
  "alloc",
  "UIApplication",
  "UIWindow",
  "UIWindowScene",
  "UIScene",
  "UISceneSession",
  "UISceneConfiguration",
  "UISceneOptions",
  "UIView",
  "UIControl",
  "UIButton",
  "UILabel",
  "UITextField",
  "UISwitch",
  "UISlider",
  "UIScrollView",
  "UITextView",
  "UIStepper",
  "UIProgressView",
  "UIImageView",
  "UISegmentedControl",
  "UIDatePicker",
  "UIColor",
  "UIColorWell",
  "UIFont",
  "UIViewController",
  "UIEvent",
  "UIImage",
  "UILayoutGuide",
  "UIKeyboardLayoutGuide",
  "UIGeometry",
  "UIGestureRecognizer",
  "UITapGestureRecognizer",
  "UIScreen",
  "UIAction",
  "UIMenu",
  "UIMenuElement",
  "NSText",
  "UITextInputTraits",
  "UITabBar",
  "UITabBarItem",
  "UITableView",
  "UITableViewCell",
  "UITableViewHeaderFooterView",
  "NSIndexPath_UIKitAdditions",
  "UIBarItem",
  "UIBarCommon",
  "UIVisualEffectView",
  "UIVisualEffect",
  "UIBlurEffect",
  "UITraitCollection",
  "UIInterface",
  "block2",
  "UINavigationController",
  "UINavigationBar",
  "UINavigationItem",
  "UIBarButtonItem",
] }
objc2-quartz-core = { version = "0.3", features = [
  "CALayer",
  "objc2-core-foundation",
] }
objc2-event-kit = { version = "0.3", optional = true, features = [
  "EKEventStore",
  "EKEvent",
  "EKCalendar",
  "EKCalendarItem",
  "EKObject",
  "EKTypes",
  "EKSource",
  "block2",
] }
any_spawner = { workspace = true }
dispatch2 = "0.3"
futures = { workspace = true, default-features = true }
taffy = { workspace = true }
block2 = "0.6"


[[test]]
name = "layout"
path = "tests/layout.rs"
harness = false

[[test]]
name = "dom_layout"
path = "tests/dom/layout.rs"
harness = false

[[test]]
name = "dom_grid_layout"
path = "tests/dom/grid_layout.rs"
harness = false

[[test]]
name = "dom_apply_attrs"
path = "tests/dom/apply_attrs.rs"
harness = false

[[test]]
name = "dom_node_lifecycle"
path = "tests/dom/node_lifecycle.rs"
harness = false

[[test]]
name = "dom_new_features"
path = "tests/dom/new_features.rs"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }
