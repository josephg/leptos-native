[package]
name = "ios_dom"
version = "0.1.0"
authors = ["Seph Gentle"]
license = "MIT"
description = "DOM-shaped façade over UIKit, used by tachys/leptos to render native iOS UIs."
rust-version.workspace = true
edition.workspace = true

[dependencies]
send_wrapper = { workspace = true, default-features = true }

[dev-dependencies]
reactive_graph = { workspace = true, features = ["effects"] }
tachys = { workspace = true, features = ["reactive_graph", "native-ui"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
any_spawner = { workspace = true }
futures = { workspace = true, default-features = true }
taffy = { version = "0.10", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
objc2-foundation = { version = "0.3", features = [
    "NSGeometry",
    "NSString",
    "NSTimer",
    "NSDate",
    "NSUserDefaults",
] }
objc2-ui-kit = { version = "0.3", features = [
    "alloc",
    "UIApplication",
    "UIWindow",
    "UIView",
    "UIControl",
    "UIButton",
    "UILabel",
    "UITextField",
    "UISwitch",
    "UISlider",
    "UIScrollView",
    "UITextView",
    "UIStepper",
    "UIProgressView",
    "UIImageView",
    "UISegmentedControl",
    "UIDatePicker",
    "UIColor",
    "UIFont",
    "UIViewController",
    "UIEvent",
    "UIImage",
    "UIGeometry",
    "UIScreen",
    "NSText",
    "UITextInputTraits",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
] }
