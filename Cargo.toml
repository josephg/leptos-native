[workspace]
resolver = "2"
members = [
  # common (renderer-agnostic)
  "common/reactive_graph",
  "common/reactive_stores",
  "common/reactive_stores_macro",
  "common/renderer",
  "common/leptos_macro",
  "common/leptos",
  "apple_shared",
  "cocoa/leptos_cocoa",
  "gtk/leptos_gtk",
  "uikit/leptos_uikit",

  # native ports
  "cocoa/dom",
  "gtk/dom",
  "uikit/dom",

  # cocoa examples
  "cocoa/examples/animation",
  "cocoa/examples/async_derived",
  "cocoa/examples/bind_tuple_form",
  "cocoa/examples/checkbox",
  "cocoa/examples/component_event_test",
  "cocoa/examples/counter",
  "cocoa/examples/counter_without_macros",
  "cocoa/examples/counters",
  "cocoa/examples/dark_mode",
  "cocoa/examples/directives",
  "cocoa/examples/error_boundary",
  "cocoa/examples/greeter",
  "cocoa/examples/grid",
  "cocoa/examples/login_form",
  "cocoa/examples/menu_demo",
  "cocoa/examples/multi_error_boundary",
  "cocoa/examples/pages",
  "cocoa/examples/parent_child",
  "cocoa/examples/persistent_counter",
  "cocoa/examples/scroll_view",
  "cocoa/examples/settings",
  "cocoa/examples/show_fallback",
  "cocoa/examples/showcase",
  "cocoa/examples/slots",
  "cocoa/examples/spotify",
  "cocoa/examples/stores",
  "cocoa/examples/timer",
  "cocoa/examples/toolbar_demo",
  "cocoa/examples/transition",
  "cocoa/examples/two_windows",

  # Cocoa correctness/leak fuzzer (binary).
  "cocoa/fuzzer",

  # Network-dependent async examples — listed in `members` so they
  # build with `cargo build --workspace`, but kept OUT of
  # `default-members` so they're skipped by `cargo build` with no
  # args. See docs/book/src/async/ for what they demonstrate.
  "cocoa/examples/async_patterns",
  "cocoa/examples/ipify",
  "cocoa/examples/ipify_compio",
  "cocoa/examples/ipify_current_thread",
  "cocoa/examples/placecats",

  # iOS examples live in their own workspace at uikit/examples/.
  # See uikit/examples/Cargo.toml.

  # GTK examples — analogous to the cocoa examples list. Each
  # example's `[target.'cfg(target_os = "linux")'.dependencies]`
  # gates the leptos_gtk dep so they compile to empty rlibs on
  # macOS (still needed for `cargo build --workspace` to succeed
  # cross-platform).
  "gtk/examples/async_patterns",
  "gtk/examples/checkbox",
  "gtk/examples/counter",
  "gtk/examples/counters",
  "gtk/examples/greeter",
  "gtk/examples/grid",
  "gtk/examples/ipify",
  "gtk/examples/login_form",
  "gtk/examples/menu_demo",
  "gtk/examples/persistent_settings",
  "gtk/examples/settings",
]

# `cargo test` / `cargo build` (no args) operate on `default-members`.
default-members = [
  "common/reactive_graph",
  "common/reactive_stores",
  "common/reactive_stores_macro",
  "common/renderer",
  "common/leptos_macro",
  "common/leptos",
  "apple_shared",
  "cocoa/leptos_cocoa",
  "cocoa/dom",
  "gtk/dom",
  "gtk/leptos_gtk",

  "cocoa/examples/async_derived",
  "cocoa/examples/bind_tuple_form",
  "cocoa/examples/checkbox",
  "cocoa/examples/component_event_test",
  "cocoa/examples/counter",
  "cocoa/examples/counter_without_macros",
  "cocoa/examples/counters",
  "cocoa/examples/dark_mode",
  "cocoa/examples/directives",
  "cocoa/examples/error_boundary",
  "cocoa/examples/greeter",
  "cocoa/examples/grid",
  "cocoa/examples/login_form",
  "cocoa/examples/menu_demo",
  "cocoa/examples/multi_error_boundary",
  "cocoa/examples/pages",
  "cocoa/examples/parent_child",
  "cocoa/examples/persistent_counter",
  "cocoa/examples/scroll_view",
  "cocoa/examples/settings",
  "cocoa/examples/show_fallback",
  "cocoa/examples/showcase",
  "cocoa/examples/slots",
  "cocoa/examples/spotify",
  "cocoa/examples/stores",
  "cocoa/examples/timer",
  "cocoa/examples/toolbar_demo",
  "cocoa/examples/transition",
  "cocoa/examples/two_windows",

  # GTK examples — listed in `members` above so `cargo build --workspace`
  # discovers them, but kept OUT of `default-members` because they
  # activate the `leptos_gtk/gtk` feature in their `Cargo.toml` and
  # therefore require gtk4 at link time. To run a GTK example on
  # macOS, install gtk4 via Homebrew (`brew install gtk4`) and use
  # `cargo run -p counter_gtk` (or any other `*_gtk` target).
]
exclude = [
  "benchmarks",
  "projects",
  "uikit/xcuitests",
  # iOS examples live in their own workspace at uikit/examples/.
  # See uikit/examples/Cargo.toml. They build only for iOS
  # targets, which Cargo can't gate via workspace membership.
  "uikit/examples",

  # Cocoa examples that don't build today — they hit features
  # still on the deferred punch list (HTTP/JSON deps in `fetch`,
  # full TodoMVC). Kept in the source tree as documentation.
  "cocoa/examples/fetch",
  "cocoa/examples/todomvc",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
# --- workspace member crates (path-pinned) ---
renderer = { path = "./common/renderer", version = "0.1.0" }
reactive_graph = { path = "./common/reactive_graph", version = "0.2.14" }
reactive_stores = { path = "./common/reactive_stores", version = "0.4.3" }
reactive_stores_macro = { path = "./common/reactive_stores_macro", version = "0.4.2" }
leptos_macro = { path = "./common/leptos_macro", version = "0.1.0" }
leptos = { path = "./common/leptos", version = "0.1.0" }
leptos_uikit = { path = "./uikit/leptos_uikit", version = "0.1.0" }
leptos_gtk = { path = "./gtk/leptos_gtk", version = "0.1.0" }
leptos_apple_shared = { path = "./apple_shared", version = "0.1.0" }

# --- crates.io utility deps (formerly vendored, unmodified) ---
throw_error = { default-features = false, version = "0.3.1" }
any_spawner = { default-features = false, version = "0.3.0" }
const_str_slice_concat = { default-features = false, version = "0.1" }
either_of = { default-features = false, version = "0.1.9" }
next_tuple = { default-features = false, version = "0.1.0" }
oco_ref = { default-features = false, version = "0.2.1" }
or_poisoned = { default-features = false, version = "0.1.0" }

# --- third-party deps ---
itertools = { default-features = false, version = "0.14" }
convert_case = { default-features = false, version = "0.11" }
convert_case_extras = { default-features = false, version = "0.2" }
serde_json = { default-features = false, version = "1.0" }
typed-builder = { default-features = false, version = "0.23" }
typed-builder-macro = { default-features = false, version = "0.23" }
thiserror = { default-features = false, version = "2.0" }
indexmap = { default-features = false, version = "2.13" }
rstml = { default-features = false, version = "0.12" }
rustc_version = { default-features = false, version = "0.4" }
guardian = { default-features = false, version = "1.3" }
rustc-hash = { default-features = false, version = "2.1" }
tracing = { default-features = false, version = "0.1" }
slotmap = { default-features = false, version = "1.1" }
taffy = { default-features = false, version = "0.10", features = ["std", "flexbox", "grid", "taffy_tree"] }
futures = { default-features = false, version = "0.3" }
pin-project-lite = { default-features = false, version = "0.2" }
send_wrapper = { default-features = false, version = "0.6" }
tokio-test = { default-features = false, version = "0.4" }
html-escape = { default-features = false, version = "0.2" }
proc-macro-error2 = { default-features = false, version = "2.0" }
tokio = { default-features = false, version = "1.49" }
cfg-if = { default-features = false, version = "1.0" }
proc-macro2 = { default-features = false, version = "1.0" }
serde = { default-features = false, version = "1.0" }
syn = { default-features = false, version = "2.0" }
paste = { default-features = false, version = "1.0" }
quote = { default-features = false, version = "1.0" }
serial_test = { default-features = false, version = "3.3" }
glib = { default-features = false, version = "0.21" }
gio = { default-features = false, version = "0.21" }
gtk4 = { default-features = false, version = "0.10" }
prettyplease = { default-features = false, version = "0.2" }
uuid = { default-features = false, version = "1.20" }
attribute-derive = { default-features = false, version = "0.10" }
async-lock = { default-features = false, version = "3.4" }
subsecond = { default-features = false, version = "0.7" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
#strip = true
#panic = "abort"

[workspace.metadata.cargo-all-features]
max_combination_size = 2

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(leptos_debuginfo)',
  'cfg(erase_components)',
] }
